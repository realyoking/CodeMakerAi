<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMaker AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
    --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
    --panel: #ffffff; --border: #e2e8f0;
    --tx: #0f172a; --tx2: #475569; --mt: #94a3b8;
    --ac: #6366f1; --ac2: #818cf8; --acG: rgba(99,102,241,0.1);
    --dn: #ef4444; --ok: #10b981; --warn: #f59e0b; --pink: #ec4899;
}
body.dark { --bg: #0f172a; --bg2: #1e293b; --bg3: #334155; --panel: #1e293b; --border: #334155; --tx: #f1f5f9; --tx2: #cbd5e1; --mt: #64748b; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--tx); transition: background 0.3s; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* HOME */
#home-view { position: absolute; inset: 0; overflow-y: auto; z-index: 10; background: var(--bg); }
.hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
.hero-bg { position: absolute; inset: 0; background: url('https://i.postimg.cc/rpJxTXpm/IMG-1873.jpg') center/cover no-repeat; filter: brightness(0.9); z-index: -1; }
.hero-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,23,42,0.6) 0%, var(--bg) 100%); }
.hero-content { text-align: center; max-width: 720px; z-index: 1; }
.hero-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; color: #fff; font-size: 12px; margin-bottom: 24px; backdrop-filter: blur(10px); }
.hero-title { font-size: 3rem; font-weight: 700; color: #fff; margin-bottom: 16px; text-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.hero-sub { color: rgba(255,255,255,0.9); font-size: 1.1rem; margin-bottom: 32px; }
.model-pills { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.mp { padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 12px; cursor: pointer; }
.mp.active { background: var(--ac); border-color: var(--ac); }
.input-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px; display: flex; gap: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); position: relative; }
.input-box input { flex: 1; border: none; outline: none; padding: 12px; background: transparent; color: var(--tx); font-size: 15px; }
.input-box button { padding: 0 20px; border: none; background: var(--ac); color: #fff; border-radius: 8px; font-weight: 600; cursor: pointer; }
.typing-overlay { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--mt); pointer-events: none; font-size: 15px; display: flex; align-items: center; }
.typing-overlay .cursor { width: 2px; height: 18px; background: var(--ac); margin-left: 2px; animation: blink 1s step-end infinite; }
.chips { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.chip { padding: 6px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 12px; border-radius: 999px; cursor: pointer; }

.proj-section { padding: 60px 24px; max-width: 1000px; margin: 0 auto; }
.proj-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.proj-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: 0.2s; position: relative; }
.proj-card:hover { border-color: var(--ac); transform: translateY(-2px); }
.proj-name { font-weight: 600; margin-bottom: 4px; }
.proj-meta { font-size: 12px; color: var(--mt); }
.proj-del { position: absolute; top: 12px; right: 12px; color: var(--mt); opacity: 0; transition: 0.2s; cursor: pointer; }
.proj-card:hover .proj-del { opacity: 1; }

/* EDITOR */
#editor-view { position: absolute; inset: 0; display: none; flex-direction: column; z-index: 20; background: var(--bg); }
#editor-view.active { display: flex; }
.ed-header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); height: 56px; }
.ed-btn { width: 32px; height: 32px; border-radius: 6px; background: transparent; border: 1px solid transparent; color: var(--tx2); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.ed-btn:hover { background: var(--bg2); border-color: var(--border); }
.ed-title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-actions { display: flex; gap: 4px; align-items: center; }
.ms-dd { position: relative; }
.ms-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--tx); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.ms-menu { position: absolute; top: 40px; right: 0; width: 240px; background: var(--panel); border: 1px solid var(--border); border-radius:8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 6px; z-index: 100; display: none; }
.ms-menu.open { display: block; }
.ms-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.ms-item:hover { background: var(--bg2); }
.ms-item.active { background: var(--acG); color: var(--ac); }

/* Added min-height: 0 to fix scrolling in flexbox */
.ed-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* CHAT */
.chat-panel { width: 400px; min-width: 320px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--border); }
.chat-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.chat-welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; color: var(--mt); }
.chat-welcome i { font-size: 28px; margin-bottom: 12px; color: var(--ac); }
.chat-welcome h3 { color: var(--tx); margin-bottom: 6px; }
.chat-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
.chat-act { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; cursor: pointer; background: var(--bg2); }

.msg { display: flex; gap: 10px; animation: fadeIn 0.3s; }
.msg.user { flex-direction: row-reverse; }
.msg-av { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0; }
.msg.ai .msg-av { background: var(--ac); }
.msg.user .msg-av { background: var(--tx2); }
.msg.tool .msg-av { background: var(--warn); }
.msg-bubble { max-width: 85%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; color: var(--tx); }
.msg.ai .msg-bubble { background: var(--bg2); border: 1px solid var(--border); border-top-left-radius: 2px; }
.msg.user .msg-bubble { background: var(--ac); color: #fff; border-top-right-radius: 2px; }

/* Live Stream Text & Task List */
.thinking-text { color: var(--mt); font-style: italic; }
.cursor-blink { display: inline-block; width: 8px; height: 14px; background: var(--ac); margin-left: 2px; animation: blink 1s step-end infinite; vertical-align: text-bottom; }
.task-list { margin: 8px 0; padding: 8px; background: rgba(99,102,241,0.05); border: 1px solid var(--border); border-radius: 8px; }
.task-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; color: var(--tx2); }
.task-item i { width: 16px; text-align: center; color: var(--mt); }
.task-item.active i { color: var(--ac); }

.tool-badge { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; margin-top: 6px; background: var(--bg3); color: var(--tx2); }
.tool-badge.write { background: rgba(16,185,129,0.1); color: var(--ok); }
.tool-badge.asset { background: rgba(236,72,153,0.1); color: var(--pink); }
.tool-badge.loading { background: rgba(99,102,241,0.1); color: var(--ac); }
.spinner { width: 12px; height: 12px; border: 2px solid var(--mt); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }

.chat-input-area { padding: 12px; border-top: 1px solid var(--border); background: var(--panel); }
.chat-input-wrap { display: flex; gap: 8px; align-items: flex-end; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 4px 4px 4px 12px; }
.chat-input { flex: 1; border: none; outline: none; resize: none; padding: 8px 0; font-size: 14px; max-height: 120px; background: transparent; color: var(--tx); font-family: 'Inter', sans-serif; }
.chat-icons { display: flex; gap: 2px; }
.chat-icon { width: 30px; height: 30px; border: none; background: transparent; color: var(--mt); cursor: pointer; border-radius: 6px; }
.chat-icon:hover { color: var(--ac); background: var(--bg3); }
.chat-send { width: 34px; height: 34px; border: none; background: var(--ac); color: #fff; border-radius: 8px; cursor: pointer; }
.chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* PREVIEW */
.prev-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg2); min-width: 0; min-height: 0; }
.prev-tabs { display: flex; align-items: center; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border); height: 40px; gap: 4px; }
.ptab { padding: 8px 14px; border: none; background: none; color: var(--mt); font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
.ptab.active { color: var(--ac); border-bottom-color: var(--ac); }
.prev-actions { margin-left: auto; display: flex; gap: 4px; }
.pa-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--mt); cursor: pointer; font-size: 11px; }
.pa-btn.active { color: var(--ac); border-color: var(--ac); }

.files-bar { display: flex; gap: 4px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
.file-tab { padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--tx2); }
.file-tab.active { background: var(--bg2); color: var(--tx); font-weight: 500; }

.prev-main { flex: 1; display: flex; flex-direction: column; position: relative; background: #fff; min-height: 0; }
.prev-frame { width: 100%; height: 100%; border: none; transition: max-width 0.3s; align-self: center; }
.code-view { flex: 1; display: none; flex-direction: column; position: relative; min-height: 0; overflow: hidden; }
.CodeMirror { height: 100% !important; font-size: 13px; }
.apply-btn { position: absolute; bottom: 16px; right: 16px; padding: 8px 16px; border: none; background: var(--ac); color: #fff; border-radius: 8px; font-weight: 600; cursor: pointer; z-index: 10; }

.mobile-tabs { display: none; }
@media (max-width: 768px) {
    .chat-panel { width: 100%; }
    .prev-panel { display: none; }
    .ed-body.mobile-prev .chat-panel { display: none; }
    .ed-body.mobile-prev .prev-panel { display: flex; }
    .mobile-tabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); }
    .mtab { flex: 1; padding: 10px; text-align: center; border: none; background: none; color: var(--mt); border-bottom: 2px solid transparent; }
    .mtab.active { color: var(--ac); border-bottom-color: var(--ac); }
}
</style>
</head>
<body>

<div id="toast" style="position:fixed;top:20px;right:20px;z-index:9999"></div>

<!-- HOME -->
<div id="home-view">
    <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <div class="hero-badge"><i class="fas fa-bolt"></i> Powered by Agnes AI</div>
            <h1 class="hero-title">CodeMaker AI</h1>
            <p class="hero-sub">Lightning fast code generation with split files and live preview.</p>
            <div class="model-pills" id="home-models">
                <div class="mp active" data-model="2.0">2.0 Flash</div>
                <div class="mp" data-model="1.5">1.5 Flash</div>
                <div class="mp" data-model="video">Video v2</div>
                <div class="mp" data-model="image">Image</div>
            </div>
            <div class="input-box">
                <div class="typing-overlay" id="typing-overlay"><span id="typed-text"></span><span class="cursor"></span></div>
                <input type="text" id="hero-input" autocomplete="off">
                <button id="hero-submit">Generate</button>
            </div>
            <div class="chips" id="hero-chips"></div>
        </div>
    </div>
    <div class="proj-section">
        <div class="proj-header">
            <h2>Projects</h2>
            <button style="padding:8px 16px;border:none;background:var(--ac);color:#fff;border-radius:8px;cursor:pointer" id="new-btn">New Project</button>
        </div>
        <div class="proj-grid" id="proj-grid"></div>
    </div>
</div>

<!-- EDITOR -->
<div id="editor-view">
    <header class="ed-header">
        <button class="ed-btn" id="back-btn"><i class="fas fa-arrow-left"></i></button>
        <div class="ed-title" id="ed-title">Project</div>
        
        <div class="ms-dd">
            <button class="ms-btn" id="ms-btn"><i class="fas fa-microchip"></i> <span id="ms-lbl">2.0 Flash</span> <i class="fas fa-chevron-down" style="font-size:10px"></i></button>
            <div class="ms-menu" id="ms-menu">
                <div class="ms-item active" data-model="2.0">agnes-2.0-flash</div>
                <div class="ms-item" data-model="1.5">agnes-1.5-flash</div>
                <div class="ms-item" data-model="video">agnes-video-v2.0</div>
                <div class="ms-item" data-model="image">agnes-image-2.1-flash</div>
            </div>
        </div>
        
        <div class="ed-actions">
            <button class="ed-btn" id="btn-cdn" title="Dependencies"><i class="fas fa-cube"></i></button>
            <button class="ed-btn" id="btn-share" title="Share"><i class="fas fa-share"></i></button>
            <button class="ed-btn" id="btn-zip" title="Download ZIP"><i class="fas fa-download"></i></button>
            <button class="ed-btn" id="btn-theme" title="Theme"><i class="fas fa-moon"></i></button>
        </div>
    </header>
    
    <nav class="mobile-tabs">
        <button class="mtab active" data-tab="chat">Chat</button>
        <button class="mtab" data-tab="prev">Preview</button>
    </nav>

    <div class="ed-body mobile-chat" id="ed-body">
        <div class="chat-panel">
            <div class="chat-msgs" id="chat-msgs"></div>
            <div class="chat-input-area">
                <div class="chat-input-wrap">
                    <textarea class="chat-input" id="chat-input" rows="1" placeholder="Ask AI to build..."></textarea>
                    <div class="chat-icons">
                        <button class="chat-icon" id="btn-tpl" title="Templates"><i class="fas fa-magic"></i></button>
                        <button class="chat-icon" id="btn-img" title="Image to Code"><i class="fas fa-image"></i></button>
                        <button class="chat-icon" id="btn-voice" title="Voice Input"><i class="fas fa-microphone"></i></button>
                    </div>
                    <button class="chat-send" id="chat-send" disabled><i class="fas fa-arrow-up"></i></button>
                </div>
            </div>
        </div>
        
        <div class="prev-panel">
            <div class="prev-tabs">
                <button class="ptab active" data-view="prev">Preview</button>
                <button class="ptab" data-view="code">Code</button>
                <div class="prev-actions">
                    <button class="pa-btn" data-res="full" title="Desktop"><i class="fas fa-desktop"></i></button>
                    <button class="pa-btn" data-res="tab" title="Tablet"><i class="fas fa-tablet-alt"></i></button>
                    <button class="pa-btn" data-res="mob" title="Mobile"><i class="fas fa-mobile-alt"></i></button>
                </div>
            </div>
            <div class="files-bar" id="files-bar"></div>
            <div class="prev-main">
                <iframe class="prev-frame" id="prev-frame" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>
                <div class="code-view" id="code-view">
                    <textarea id="code-editor" spellcheck="false"></textarea>
                    <button class="apply-btn" id="apply-btn">Apply Changes</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const API_URL = 'https://apihub.agnes-ai.com/v1/chat/completions';
const IMG_API_URL = 'https://apihub.agnes-ai.com/v1/images/generations';
const VID_API_URL = 'https://apihub.agnes-ai.com/v1/videos/generations';
const API_KEY = 'sk-qZB4ieEv5UdIrYK3eEHAfdAv5xXYKLsVD7bAd9Kg7EQuDYF3';
const PROXY = 'https://corsproxy.io/?url=';
const MODELS = { '2.0':'agnes-2.0-flash', '1.5':'agnes-1.5-flash', 'video':'agnes-video-v2.0', 'image':'agnes-image-2.1-flash' };

const SP = `You are CodeMaker AI. 
1. First, output a brief markdown checklist of your plan using "- [ ]". Explain your steps clearly.
2. Then, output code in exactly three blocks: \`\`\`html, \`\`\`css, and \`\`\`javascript. 
3. CRITICAL: You MUST output the FULL code for all files, even if you are only modifying one small part. FAILURE TO OUTPUT FULL CODE WILL BREAK THE APP. DO NOT TRUNCATE OR USE COMMENTS LIKE "<!-- existing code -->".
4. HTML is body only. No external files. Minimal text.
5. If the user asks for an image, picture, photo, or video, you MUST call the generate_asset tool. Do NOT use SVG placeholders. The tool will return a URL (which may be a very long base64 data URI). Put it directly into the img src.`;

const ASSET_TOOL = {
    type: "function",
    function: {
        name: "generate_asset",
        description: "Generates an image or video and returns a URL.",
        parameters: {
            type: "object",
            properties: {
                type: { type: "string", enum: ["image", "video"] },
                prompt: { type: "string" }
            },
            required: ["type", "prompt"]
        }
    }
};

const TEMPLATES = [
    { title: "SaaS Landing Page", prompt: "Build a modern SaaS landing page hero section with a gradient background, headline, and CTA button." },
    { title: "Admin Dashboard", prompt: "Create an admin dashboard layout with a sidebar and a main content area for stats." },
    { title: "Video Portfolio", prompt: "Build a portfolio website that features a stock video in the hero section." },
    { title: "Snake Game", prompt: "Create a fully playable Snake game with score tracking." }
];

const CDNS = [
    { name: "Tailwind CSS", url: "https://cdn.tailwindcss.com", type: "js" },
    { name: "FontAwesome", url: "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css", type: "css" },
    { name: "Chart.js", url: "https://cdn.jsdelivr.net/npm/chart.js", type: "js" }
];

let S = { projects: [], cur: null, gen: false, model: '2.0', activeFile: 'index.html', view: 'prev', cdns: [] };
let cm;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toast(m) { const t = document.getElementById('toast'); const d = document.createElement('div'); d.style.cssText = 'padding:12px 18px;background:#fff;border:1px solid #ccc;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,0.1);margin-bottom:8px;font-size:13px'; d.textContent = m; t.appendChild(d); setTimeout(() => d.remove(), 3000); }
function save() { try { localStorage.setItem('cm_proj', JSON.stringify(S.projects)); } catch(e){} }
function load() { try { const d = localStorage.getItem('cm_proj'); S.projects = d ? JSON.parse(d) : []; S.projects = S.projects.map(p => { if (!p.files) p.files = { 'index.html': '', 'style.css': '', 'script.js': '' }; return p; }); } catch(e) { S.projects = []; } }

function createProj(prompt) {
    const p = { id: uid(), name: prompt.length > 40 ? prompt.substring(0,37)+'...' : prompt, model: S.model, messages: [{role:'user', content:prompt}], files: {'index.html':'', 'style.css':'', 'script.js':''}, activeFile: 'index.html', ts: Date.now(), cdns: [] };
    S.projects.unshift(p); save(); return p;
}

function renderGrid() {
    const g = document.getElementById('proj-grid');
    if (!S.projects.length) { g.innerHTML = '<div style="color:var(--mt);text-align:center">No projects yet</div>'; return; }
    g.innerHTML = S.projects.map(p => `
        <div class="proj-card" data-id="${p.id}">
            <div class="proj-name">${p.name}</div>
            <div class="proj-meta">${Object.keys(p.files).length} files</div>
            <div class="proj-del" data-del="${p.id}"><i class="fas fa-trash"></i></div>
        </div>
    `).join('');
    g.querySelectorAll('.proj-card').forEach(c => c.onclick = e => { if(e.target.closest('.proj-del')) return; openEditor(c.dataset.id); });

function fmtAI(content) {
    if (!content) return '<div class="spinner"></div> Thinking...';
    let proc = content;
    
    const opens = (proc.match(/```[a-z]+/g) || []).length;
    const closes = (proc.match(/```/g) || []).length;
    let isCurrentlyInCodeBlock = opens > closes;
    
    if (isCurrentlyInCodeBlock) {
        proc += '\n```';
    }

    const codeRegex = /```[a-z]+\n[\s\S]*?```/gi;
    let lastIndex = 0;
    let match;
    let html = '';

    while ((match = codeRegex.exec(proc)) !== null) {
        const text = proc.substring(lastIndex, match.index);
        if (text.trim()) {
            html += parseTextAndTasks(text, false);
        }

        const codeMatch = match[0].match(/```([a-z]+)\n([\s\S]*?)```/i);
        if (codeMatch) {
            const lang = codeMatch[1].toLowerCase();
            let file = lang === 'html' ? 'index.html' : lang === 'css' ? 'style.css' : 'script.js';
            html += `<div class="tool-badge write"><i class="fas fa-check-circle"></i> Wrote ${file}</div>`;
        }
        lastIndex = codeRegex.lastIndex;
    }

    const remainingText = proc.substring(lastIndex);
    if (remainingText.trim()) {
        if (!isCurrentlyInCodeBlock) {
            html += parseTextAndTasks(remainingText, true);
        }
    }

    return html || '<div class="spinner"></div> Thinking...';
}

function parseTextAndTasks(text, isStreaming) {
    let html = '';
    const lines = text.split('\n');
    let inTaskList = false;

    lines.forEach((line, index) => {
        const isLastLine = index === lines.length - 1;
        if (line.startsWith('- [ ] ')) {
            if (!inTaskList) {
                html += '<div class="task-list">';
                inTaskList = true;
            }
            const taskContent = line.substring(6).trim();
            const cursor = isLastLine && isStreaming ? ' <span class="cursor-blink"></span>' : '';
            html += `<div class="task-item"><i class="far fa-circle"></i> ${taskContent}${cursor}</div>`;
        } else if (line.trim() === '') {
            if (inTaskList) {
                html += '</div>';
                inTaskList = false;
            }
        } else {
            if (inTaskList) {
                html += '</div>';
                inTaskList = false;
            }
            let h = line.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            const cursor = isLastLine && isStreaming ? ' <span class="cursor-blink"></span>' : '';
            html += `<p>${h}${cursor}</p>`;
        }
    });

    if (inTaskList) {
        html += '</div>';
    }

    return html;
}

async function callAI(messages, modelKey, useAssets, onChunk) {
    const body = { 
        model: MODELS[modelKey], 
        messages: [{role:'system', content:SP}, ...messages], 
        temperature: 0.7, 
        stream: true
    };
    if (useAssets) body.tools = [ASSET_TOOL];
    
    const headers = { 'Content-Type':'application/json', 'Authorization':`Bearer ${API_KEY}` };

    try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 60000);
        const res = await fetch(API_URL, { signal: ctrl.signal, method:'POST', headers, body: JSON.stringify(body) });
        clearTimeout(timer);
        
        if (res.ok) {
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = '';
            let toolCalls = [];
            let content = '';
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop();
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const d = line.slice(6);
                        if (d === '[DONE]') continue;
                        try {
                            const j = JSON.parse(d);
                            const delta = j.choices?.[0]?.delta;
                            if (delta) {
                                if (delta.content) {
                                    content += delta.content;
                                    if (onChunk) onChunk(content);
                                }
                                if (delta.tool_calls) {
                                    delta.tool_calls.forEach(tc => {
                                        if (!toolCalls[tc.index]) toolCalls[tc.index] = { id: tc.id, function: { name: '', arguments: '' } };
                                        if (tc.id) toolCalls[tc.index].id = tc.id;
                                        if (tc.function.name) toolCalls[tc.index].function.name = tc.function.name;
                                        if (tc.function.arguments) toolCalls[tc.index].function.arguments += tc.function.arguments;
                                    });
                                }
                            }
                        } catch(e) {}
                    }
                }
            }
            return { content, toolCalls };
        }
        throw new Error(`Direct HTTP ${res.status}`);
    } catch(e) {
        if (e.name === 'AbortError') throw new Error('Request timed out');
        const res = await fetch(PROXY + encodeURIComponent(API_URL), { method:'POST', headers, body: JSON.stringify({...body, stream: false}) });
        if (res.ok) {
            const j = await res.json();
            const choice = j.choices[0].message;
            if (onChunk && choice.content) onChunk(choice.content);
            return { content: choice.content || '', toolCalls: choice.tool_calls || [] };
        }
        throw new Error(`Proxy HTTP ${res.status}`);
    }
}

function parseFiles(text) {
    const htmlM = text.match(/```html\n?([\s\S]*?)```/);
    const cssM = text.match(/```css\n?([\s\S]*?)```/);
    const jsM = text.match(/```javascript\n?([\s\S]*?)```/);
    return { html: htmlM ? htmlM[1].trim() : null, css: cssM ? cssM[1].trim() : null, js: jsM ? jsM[1].trim() : null };
}

async function generateAsset(type, prompt) {
    if (type === 'image') {
        const body = JSON.stringify({ model: 'agnes-image-2.0-flash', prompt: prompt, n: 1, size: '1024x1024' });
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` };
        
        let res;
        try {
            res = await fetch(IMG_API_URL, { method: 'POST', headers, body });
            if (!res.ok) throw new Error('Direct failed');
        } catch (e) {
            try {
                res = await fetch(PROXY + encodeURIComponent(IMG_API_URL), { method: 'POST', headers, body });
            } catch (err) {
                throw new Error('Image API network error');
            }
        }

        if (!res || !res.ok) throw new Error('Image API failed');
        const data = await res.json();
        
        if (data.data && data.data[0]) {
            if (data.data[0].url) return data.data[0].url;
            if (data.data[0].b64_json) return `data:image/png;base64,${data.data[0].b64_json}`;
        }
        throw new Error('Image API did not return a valid URL or base64');
    } else if (type === 'video') {
        const body = JSON.stringify({ model: 'agnes-video-v2.0', prompt: prompt });
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` };
        
        let res;
        try {
            res = await fetch(VID_API_URL, { method: 'POST', headers, body });
            if (!res.ok) throw new Error('Direct failed');
        } catch (e) {
            try {
                res = await fetch(PROXY + encodeURIComponent(VID_API_URL), { method: 'POST', headers, body });
            } catch (err) {
                throw new Error('Video API network error');
            }
        }

        if (!res || !res.ok) throw new Error('Video API failed');
        const data = await res.json();
        if (data.data && data.data[0] && data.data[0].url) return data.data[0].url;
        throw new Error('Video API did not return a URL');
    }
}

async function generate() {
    const p = S.projects.find(x => x.id === S.cur);
    if (!p || S.gen) return;
    S.gen = true;
    document.getElementById('chat-send').disabled = true;
    
    const md = addMsg('ai', '<div class="spinner"></div> Thinking...', true);
    const statusLog = md.querySelector('.msg-bubble');
    
    let currentMessages = [...p.messages];
    
    try {
        while (true) {
            const lastUserMsg = currentMessages.filter(m => m.role === 'user').pop();
            const promptText = typeof lastUserMsg.content === 'string' ? lastUserMsg.content : '';
            const useAssets = /image|img|video|picture|photo|asset|background/i.test(promptText);
            
            const res = await callAI(currentMessages, p.model, useAssets, (streamContent) => {
                statusLog.innerHTML = fmtAI(streamContent);
            });
            
            const choice = { role: 'assistant', content: res.content, tool_calls: res.toolCalls.length ? res.toolCalls : undefined };
            currentMessages.push(choice);
            
            if (choice.tool_calls && choice.tool_calls.length) {
                statusLog.innerHTML = choice.content ? fmtAI(choice.content) : '';
                
                for (const tc of choice.tool_calls) {
                    const toolMsg = { role: "tool", tool_call_id: tc.id, name: tc.function.name };
                    
                    if (tc.function.name === 'generate_asset') {
                        const args = JSON.parse(tc.function.arguments);
                        statusLog.innerHTML += `<div class="tool-badge asset"><div class="spinner"></div> Generating ${args.type}: ${args.prompt}...</div>`;
                        try {
                            const assetUrl = await generateAsset(args.type, args.prompt);
                            toolMsg.content = `Asset generated successfully. Use this URL in your code: ${assetUrl}`;
                            statusLog.innerHTML += `<div class="tool-badge asset"><i class="fas fa-check-circle"></i> Generated asset URL ready</div>`;
                        } catch(e) {
                            toolMsg.content = `Failed to generate asset. Please use a placeholder.`;
                            statusLog.innerHTML += `<div class="tool-badge asset" style="color:var(--dn)"><i class="fas fa-times-circle"></i> Failed to generate asset</div>`;
                        }
                    }
                    currentMessages.push(toolMsg);
                }
            } else {
                const files = parseFiles(choice.content || '');
                if (files.html) p.files['index.html'] = files.html;
                if (files.css) p.files['style.css'] = files.css;
                if (files.js) p.files['script.js'] = files.js;
                updatePreview();
                if (S.view === 'code') loadFileToEditor();
                
                p.messages = currentMessages;
                save();
                break;
            }
        }
    } catch(e) {
        statusLog.innerHTML += `<br><span style="color:var(--dn)">Error: ${e.message}</span>`;
    }
    
    S.gen = false;
    document.getElementById('chat-send').disabled = false;
    save();
}

                reader.onload = r => {
                    const p = S.projects.find(x => x.id === S.cur);
                    p.messages.push({role:'user', content: [{type:'text', text:'Build this'}, {type:'image_url', image_url:{url:r.target.result}}]});
                    save(); addMsg('user', '[Image Uploaded]'); generate();
                };
                reader.readAsDataURL(file);
            };
            inp.click();
        };
        
        document.getElementById('btn-voice').onclick = () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                toast('Voice input not supported in this browser.');
                return;
            }
            const recog = new SpeechRecognition();
            recog.lang = 'en-US'; 
            recog.start();
            toast('Listening...');
            recog.onresult = e => { 
                document.getElementById('chat-input').value = e.results[0][0].transcript; 
                document.getElementById('chat-send').disabled = false; 
            };
        };
        
        if (window.location.hash.startsWith('#share=')) {
            try {
                const data = JSON.parse(atob(window.location.hash.substring(7)));
                const p = { id: uid(), name: 'Shared Project', model: '2.0', messages: [], files: data, activeFile: 'index.html', ts: Date.now(), cdns: [] };
                S.projects.unshift(p); save(); openEditor(p.id);
            } catch(e) {}
        }
    } catch(e) {
        console.error("Initialization Error:", e);
        toast("App failed to initialize. Check console (F12).");
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

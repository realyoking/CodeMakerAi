<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMaker AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
    --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
    --panel: #ffffff; --border: #e2e8f0;
    --tx: #0f172a; --tx2: #475569; --mt: #94a3b8;
    --ac: #6366f1; --ac2: #818cf8; --acG: rgba(99,102,241,0.1);
    --dn: #ef4444; --ok: #10b981; --warn: #f59e0b; --pink: #ec4899;
    --gh: #24292e;
}
body.dark { --bg: #0f172a; --bg2: #1e293b; --bg3: #334155; --panel: #1e293b; --border: #334155; --tx: #f1f5f9; --tx2: #cbd5e1; --mt: #64748b; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--tx); transition: background 0.3s; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes shine { 0% { left: -100px; } 60% { left: 100%; } to { left: 100%; } }
@keyframes progressAnim { 0% { left: -30%; } 100% { left: 100%; } }
@keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

/* HOME */
#home-view { position: absolute; inset: 0; overflow-y: auto; z-index: 10; background: var(--bg); }
.hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
.hero-bg { position: absolute; inset: 0; background: url('https://i.postimg.cc/rpJxTXpm/IMG-1873.jpg') center/cover no-repeat; filter: brightness(0.9); z-index: -1; }
.hero-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,23,42,0.6) 0%, var(--bg) 100%); }
.hero-content { text-align: center; max-width: 760px; z-index: 1; width: 100%; }
.hero-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; color: #fff; font-size: 12px; margin-bottom: 24px; backdrop-filter: blur(10px); }
.hero-title { font-size: 3rem; font-weight: 800; color: #fff; margin-bottom: 16px; text-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.hero-sub { color: rgba(255,255,255,0.9); font-size: 1.1rem; margin-bottom: 32px; }
.model-pills { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.mp { padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 12px; cursor: pointer; transition: 0.2s; }
.mp:hover { background: rgba(255,255,255,0.2); }
.mp.active { background: var(--ac); border-color: var(--ac); }
.input-box { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 6px; display: flex; gap: 6px; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); position: relative; width: 100%; max-width: 680px; margin: 0 auto; height: 52px; }
.input-box input { flex: 1; border: none; outline: none; padding: 0 20px; background: transparent; color: var(--tx); font-size: 15px; height: 100%; min-width: 0; }
.typing-overlay { position: absolute; left: 26px; top: 50%; transform: translateY(-50%); color: var(--mt); pointer-events: none; font-size: 15px; display: flex; align-items: center; max-width: 60%; overflow: hidden; white-space: nowrap; }
.typing-overlay .cursor { width: 2px; height: 16px; background: var(--ac); margin-left: 2px; animation: blink 1s step-end infinite; }
.chips { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.chip { padding: 6px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 12px; border-radius: 999px; cursor: pointer; }

/* Generate Button */
.btn-gen { display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 15px -5px rgba(99, 102, 241, 0.6); transition: all 0.3s; position: relative; overflow: hidden; font-size: 13px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; padding: 0 16px; cursor: pointer; flex-shrink: 0; height: 40px; line-height: 1; margin-right: 2px; }
.btn-gen:hover { box-shadow: 0 6px 20px -5px rgba(99, 102, 241, 0.8); border-color: rgba(255,255,255,0.3); transform: translateY(-1px); }
.btn-gen .shine-effect { content: ''; position: absolute; width: 60px; height: 100%; background-image: linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.6), rgba(255,255,255,0) 70%); top: 0; left: -60px; pointer-events: none; }
.btn-gen:hover .shine-effect { animation: shine 1.5s ease-out infinite; }
.btn-gen svg { width: 14px; height: 14px; transition: transform 0.3s ease-in-out; }
.btn-gen:hover svg { transform: translateX(3px); }

/* Library View Toggle */
.lib-toggle { display: flex; background: var(--bg2); padding: 4px; border-radius: 12px; margin-bottom: 24px; width: fit-content; margin-left: auto; margin-right: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.lib-btn { padding: 8px 24px; border: none; background: none; cursor: pointer; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--mt); transition: 0.2s; display: flex; align-items: center; gap: 6px; }
.lib-btn.active { background: var(--panel); color: var(--tx); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

.proj-section { padding: 0px 24px 120px; max-width: 1200px; margin: 0 auto; }
.proj-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.proj-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
.proj-card:hover { border-color: var(--ac); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
.proj-card-thumb { height: 140px; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: 700; }
.proj-name { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; font-size: 15px; }
.proj-meta { font-size: 12px; color: var(--mt); }
.proj-del { position: absolute; top: 12px; right: 12px; color: var(--mt); opacity: 0; transition: 0.2s; cursor: pointer; background: rgba(255,255,255,0.8); padding: 6px; border-radius: 6px; }
.proj-card:hover .proj-del { opacity: 1; }
.verified-badge { color: var(--ac); font-size: 12px; }

/* EDITOR */
#editor-view { position: absolute; inset: 0; display: none; flex-direction: column; z-index: 20; background: var(--bg); }
#editor-view.active { display: flex; }
.ed-header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); height: 56px; }
.ed-btn { width: 32px; height: 32px; border-radius: 6px; background: transparent; border: 1px solid transparent; color: var(--tx2); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.ed-btn:hover { background: var(--bg2); border-color: var(--border); }
.ed-title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.ed-actions { display: flex; gap: 4px; align-items: center; }
.ms-dd { position: relative; }
.ms-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--tx); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.ms-menu { position: absolute; top: 40px; right: 0; width: 240px; background: var(--panel); border: 1px solid var(--border); border-radius:8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 6px; z-index: 100; display: none; }
.ms-menu.open { display: block; }
.ms-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.ms-item:hover { background: var(--bg2); }
.ms-item.active { background: var(--acG); color: var(--ac); }

.ed-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* CHAT */
.chat-panel { width: 400px; min-width: 320px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--border); }
.chat-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.chat-welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; color: var(--mt); }
.chat-welcome i { font-size: 28px; margin-bottom: 12px; color: var(--ac); }
.chat-welcome h3 { color: var(--tx); margin-bottom: 6px; }

.msg { display: flex; gap: 10px; animation: fadeIn 0.3s; position: relative; }
.msg.user { flex-direction: row-reverse; }
.msg-av { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0; }
.msg.ai .msg-av { background: var(--ac); }
.msg.user .msg-av { background: var(--tx2); }
.msg.tool .msg-av { background: var(--warn); }
.msg-bubble { max-width: 85%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; color: var(--tx); position: relative; overflow: hidden; }
.msg.ai .msg-bubble { background: var(--bg2); border: 1px solid var(--border); border-top-left-radius: 2px; }
.msg.user .msg-bubble { background: var(--ac); color: #fff; border-top-right-radius: 2px; }

/* Progress Bar & Skeleton */
.msg-progress-bar { position: absolute; bottom: 0; left: 0; width: 30%; height: 2px; background: var(--ac); animation: progressAnim 1.5s ease-in-out infinite; display: none; }
.msg.thinking .msg-progress-bar { display: block; }
.skeleton-line { height: 10px; background: var(--bg3); border-radius: 4px; margin-bottom: 8px; animation: pulse 1.5s infinite; }
.skeleton-line:last-child { width: 60%; margin-bottom: 0; }

/* Message Actions (Copy/Retry) */
.msg-actions { display: flex; gap: 4px; margin-top: 8px; opacity: 0; transition: opacity 0.2s; }
.msg.ai:hover .msg-actions { opacity: 1; }
.msg-action-btn { background: none; border: 1px solid var(--border); color: var(--mt); padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.msg-action-btn:hover { color: var(--ac); border-color: var(--ac); }

.tool-badge { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; margin-top: 6px; background: var(--bg3); color: var(--tx2); }
.tool-badge.write { background: rgba(16,185,129,0.1); color: var(--ok); }
.tool-badge.asset { background: rgba(236,72,153,0.1); color: var(--pink); }
.spinner { width: 12px; height: 12px; border: 2px solid var(--mt); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }

.chat-input-area { padding: 12px; border-top: 1px solid var(--border); background: var(--panel); }
.chat-input-wrap { display: flex; gap: 8px; align-items: flex-end; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 4px 4px 4px 12px; }
.chat-input { flex: 1; border: none; outline: none; resize: none; padding: 8px 0; font-size: 14px; max-height: 120px; background: transparent; color: var(--tx); font-family: 'Inter', sans-serif; min-width: 0; }
.chat-icons { display: flex; gap: 2px; }
.chat-icon { width: 30px; height: 30px; border: none; background: transparent; color: var(--mt); cursor: pointer; border-radius: 6px; display:flex; align-items:center; justify-content:center; }
.chat-icon:hover { color: var(--ac); background: var(--bg3); }
.chat-send { width: 34px; height: 34px; border: none; background: var(--ac); color: #fff; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.3s; }
.chat-send.stop { background: var(--dn); }
.chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* PREVIEW */
.prev-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg2); min-width: 0; min-height: 0; }
.prev-tabs { display: flex; align-items: center; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border); height: 40px; gap: 4px; }
.ptab { padding: 8px 14px; border: none; background: none; color: var(--mt); font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
.ptab.active { color: var(--ac); border-bottom-color: var(--ac); }
.prev-actions { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.pa-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--mt); cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.pa-btn.active { color: var(--ac); border-color: var(--ac); }
.zoom-text { font-size: 11px; color: var(--mt); width: 35px; text-align: center; }

.files-bar { display: flex; gap: 4px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
.file-tab { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--tx2); white-space: nowrap; }
.file-tab.active { background: var(--bg2); color: var(--tx); font-weight: 500; }
.file-tab i { font-size: 12px; color: var(--mt); }
.file-tab.active i { color: var(--ac); }
.file-lock { font-size: 10px; opacity: 0.6; cursor: pointer; }
.file-lock.locked { color: var(--warn); opacity: 1; }

.prev-main { flex: 1; display: flex; flex-direction: column; position: relative; background: #fff; min-height: 0; overflow: hidden; }
.prev-frame { width: 100%; height: 100%; border: none; transition: max-width 0.3s; align-self: center; }
.code-view { flex: 1; display: none; flex-direction: column; position: relative; min-height: 0; overflow: hidden; }
.CodeMirror { height: 100% !important; font-size: 13px; }
.apply-btn { position: absolute; bottom: 16px; right: 16px; padding: 8px 16px; border: none; background: var(--ac); color: #fff; border-radius: 8px; font-weight: 600; cursor: pointer; z-index: 10; }

/* Tasks View */
.tasks-view { flex: 1; display: none; flex-direction: column; overflow-y: auto; padding: 16px; background: var(--bg2); min-height: 0; }
.task-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.task-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; color: var(--tx2); }
.task-item i { color: var(--ac); }

/* Assets View */
.assets-view { flex: 1; display: none; flex-direction: column; overflow-y: auto; padding: 16px; background: var(--bg2); min-height: 0; }
.asset-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.asset-preview { width: 100%; height: 200px; background: #000; display: flex; align-items: center; justify-content: center; }
.asset-preview img, .asset-preview video { max-width: 100%; max-height: 100%; object-fit: cover; }
.asset-info { padding: 12px; }
.asset-type { font-size: 11px; font-weight: 700; color: var(--ac); text-transform: uppercase; margin-bottom: 4px; }
.asset-prompt { font-size: 13px; color: var(--tx2); margin-bottom: 12px; }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--mt); cursor: pointer; font-size: 24px; line-height: 1; }
.modal-desc { font-size: 13px; color: var(--mt); margin-bottom: 16px; line-height: 1.5; }
.modal-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--tx); font-family: 'Inter', sans-serif; font-size: 14px; margin-bottom: 12px; }
.modal-btn { padding: 10px 20px; border-radius: 8px; border: none; background: var(--ac); color: #fff; cursor: pointer; font-weight: 600; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
.modal-btn.gh { background: var(--gh); }
.history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
.restore-btn { padding: 6px 12px; background: var(--ac); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }

.mobile-tabs { display: none; }
@media (max-width: 768px) {
    .chat-panel { width: 100%; }
    .prev-panel { display: none; }
    .ed-body.mobile-prev .chat-panel { display: none; }
    .ed-body.mobile-prev .prev-panel { display: flex; }
    .mobile-tabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); }
    .mtab { flex: 1; padding: 12px; text-align: center; border: none; background: none; color: var(--mt); font-weight: 500; border-bottom: 2px solid transparent; }
    .mtab.active { color: var(--ac); border-bottom-color: var(--ac); }
    .input-box { flex-direction: column; border-radius: 24px; height: auto; padding: 12px; gap: 12px; }
    .typing-overlay { display: none; }
    .btn-gen { width: 100%; justify-content: center; padding: 14px; font-size: 15px; height: auto; }
}
</style>
</head>
<body>

<div id="toast" style="position:fixed;top:20px;right:20px;z-index:9999"></div>

<!-- Generic Modal -->
<div class="modal-overlay" id="generic-modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="generic-modal-title">Title</div>
            <button class="modal-close" onclick="document.getElementById('generic-modal').classList.remove('show')">&times;</button>
        </div>
        <div id="generic-modal-body"></div>
    </div>
</div>

<!-- HOME -->
<div id="home-view">
    <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <div class="hero-badge"><i class="fas fa-bolt"></i> Powered by Agnes AI</div>
            <h1 class="hero-title">CodeMaker AI</h1>
            <p class="hero-sub">Lightning fast code generation with split files, live preview, and asset management.</p>
            <div class="model-pills" id="home-models">
                <div class="mp active" data-model="2.0">2.0 Flash</div>
                <div class="mp" data-model="1.5">1.5 Flash</div>
                <div class="mp" data-model="video">Video v2</div>
                <div class="mp" data-model="image">Image</div>
            </div>
            <div class="input-box">
                <div class="typing-overlay" id="typing-overlay"><span id="typed-text"></span><span class="cursor"></span></div>
                <input type="text" id="hero-input" autocomplete="off">
                <button id="hero-submit" class="btn-gen">
                    <div class="shine-effect"></div>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path></svg>
                    Generate
                </button>
            </div>
            <div class="chips" id="hero-chips"></div>
        </div>
    </div>
    
    <div class="proj-section">
        <div class="lib-toggle">
            <button class="lib-btn active" id="tab-projects" onclick="switchLibView('projects')"><i class="fas fa-folder"></i> My Projects</button>
            <button class="lib-btn" id="tab-templates" onclick="switchLibView('templates')"><i class="fas fa-layout-template"></i> Templates</button>
        </div>
        <div id="projects-view">
            <div class="proj-header">
                <h2>Your Projects</h2>

<script>
const API_URL = 'https://apihub.agnes-ai.com/v1/chat/completions';
const IMG_API_URL = 'https://apihub.agnes-ai.com/v1/images/generations';
const VID_API_URL = 'https://apihub.agnes-ai.com/v1/videos/generations';
const API_KEY = 'sk-qZB4ieEv5UdIrYK3eEHAfdAv5xXYKLsVD7bAd9Kg7EQuDYF3';
const PROXY = 'https://corsproxy.io/?url=';
const MODELS = { '2.0':'agnes-2.0-flash', '1.5':'agnes-1.5-flash', 'video':'agnes-video-v2.0', 'image':'agnes-image-2.1-flash' };

const DEFAULT_DESIGN_MD = `# Design System\n\n## Aesthetics\nModern, sleek, and visually striking. NEVER use default browser styles.\n\n## Colors\nUse a sophisticated palette. Prefer dark themes (e.g., #0f172a background, #f1f5f9 text) with vibrant, glowing accents (indigo, violet, fuchsia). Use CSS variables.\n\n## Typography\nUse 'Inter' for sans-serif and 'JetBrains Mono' for code. Large, bold headings (clamp up to 4rem) with tight tracking. Muted, readable body text.\n\n## Layout\nGenerous whitespace (padding: 2rem+). Centered max-width containers (1200px). Fully responsive Flexbox/Grid.\n\n## Components\nBackgrounds should be subtle (rgba). Use 1px solid borders with low opacity. Border-radius 12px-16px. Use backdrop-filter: blur() for glassmorphism.\n\n## Interactions\nSmooth transitions (0.3s ease). Hover states should scale slightly (1.02) and increase glow/shadow.`;

const SP = `You are CodeMaker AI, an autonomous coding agent.\nCRITICAL RULE: You MUST output the FULL code for all files. Do NOT truncate.\nTo prevent timeouts, you MUST use the 'write_file' tool to write code. DO NOT output code in markdown blocks. \n\n# TASK PLANNING\n1. First, output a brief markdown checklist of your plan using "- [ ]". The system will extract this and show it in the Tasks tab. Do not output the tasks again in the chat.\n2. Use the 'write_file' tool to write files one by one. Wait for confirmation after each file.\n\n# FILE SYSTEM\nYou can create ANY file type (e.g., index.html, style.css, script.js, App.tsx, main.py, db.json, design.md).\nIf the user asks for a web app, ensure you write standard web files (index.html, style.css, script.js) for the live preview to work.\n\n# DESIGN SYSTEM (design.md)\nYou MUST strictly follow the design rules specified in the project's 'design.md' file. If the user asks for a design change, update the 'design.md' file using the 'write_file' tool.\n\n# LOCKED FILES\nIf a file is marked as "locked", you MUST NOT modify it. Output the exact same content if asked to write to it.\n\n# ASSETS & ANIMATIONS\nIf the user asks for a video or animation, use the 'generate_asset' tool with type="video". \nIf the user asks for an image, picture, or photo, use the 'generate_asset' tool with type="image". \nDo NOT use SVG placeholders. Put the returned URL directly into the img/video src.\nFor scroll animations, use IntersectionObserver in script.js.\nFor video backgrounds, make them full-screen, looping, and muted with a dark overlay.`;

const TEMPLATES = [
    { id: 't1', title: 'SaaS Landing Page', color: '#6366f1', verified: true, author: 'CodeMaker AI', prompt: 'Build a high-converting SaaS landing page. Include a sticky navbar, a hero section with a gradient background, feature cards with hover effects, and a footer. Use modern glassmorphism.' },
    { id: 't2', title: 'Scroll Animation Portfolio', color: '#ec4899', verified: true, author: 'CodeMaker AI', prompt: 'Build a personal portfolio website. Use IntersectionObserver to fade in elements as the user scrolls down. Include a hero section, an about me section, and a projects grid.' },
    { id: 't3', title: 'Video Background Hero', color: '#14b8a6', verified: true, author: 'CodeMaker AI', prompt: 'Build a hero section with a generated video as a full-screen background. Overlay a dark gradient and centered white text. Make the video loop and muted.' },
    { id: 't4', title: 'Snake Game', color: '#10b981', verified: true, author: 'CodeMaker AI', prompt: 'Create a fully playable Snake game with score tracking and modern UI.' }
];

let S = { projects: [], cur: null, gen: false, model: '2.0', activeFile: 'index.html', view: 'prev', githubToken: localStorage.getItem('gh_token') || '', autoRefresh: true, zoom: 1, tasks: [] };
let cm;
let abortCtrl = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toast(m) { const t = document.getElementById('toast'); const d = document.createElement('div'); d.style.cssText = 'padding:12px 18px;background:#fff;border:1px solid #ccc;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,0.1);margin-bottom:8px;font-size:13px'; d.textContent = m; t.appendChild(d); setTimeout(() => d.remove(), 3000); }

function saveProjects() { try { localStorage.setItem('cm_proj', JSON.stringify(S.projects)); } catch(e){} }
function loadProjects() { try { const d = localStorage.getItem('cm_proj'); S.projects = d ? JSON.parse(d) : []; S.projects = S.projects.map(p => { if (!p.files) p.files = { 'index.html': '', 'style.css': '', 'script.js': '', 'design.md': DEFAULT_DESIGN_MD }; if (!p.assets) p.assets = []; if (!p.history) p.history = []; if (!p.lockedFiles) p.lockedFiles = []; if (!p.files['design.md']) p.files['design.md'] = DEFAULT_DESIGN_MD; return p; }); } catch(e) { S.projects = []; } }

function getSystemPrompt() {
    let prompt = SP;
    const p = S.projects.find(x => x.id === S.cur);
    if (p && p.files['design.md']) {
        prompt += `\n\n# PROJECT DESIGN RULES (design.md)\nYou MUST strictly follow these design rules for this project:\n${p.files['design.md']}\n`;
    }
    if (p && p.lockedFiles && p.lockedFiles.length > 0) {
        prompt += `\n\n# LOCKED FILES\nThe following files are locked and MUST NOT be modified:\n${p.lockedFiles.join(', ')}\n`;
    }
    if (S.tasks.length > 0) {
        prompt += `\n\n# CURRENT TASKS\nHere is the current task list. Please complete these:\n${S.tasks.map(t => '- [ ] ' + t).join('\n')}\n`;
    }
    return prompt;
}

function createProj(prompt, model) {
    const p = { id: uid(), name: prompt.length > 40 ? prompt.substring(0,37)+'...' : prompt, model: model || S.model, messages: [{role:'user', content:prompt}], files: {'index.html':'', 'style.css':'', 'script.js':'', 'design.md': DEFAULT_DESIGN_MD}, assets: [], history: [], lockedFiles: [], activeFile: 'index.html', ts: Date.now() };
    S.projects.unshift(p); saveProjects(); return p;
}

function renderGrid() {
    const g = document.getElementById('proj-grid');
    if (!S.projects.length) { g.innerHTML = '<div style="color:var(--mt);text-align:center">No projects yet</div>'; return; }
    g.innerHTML = S.projects.map(p => `
        <div class="proj-card" data-id="${p.id}">
            <div class="proj-card-thumb" style="background:linear-gradient(135deg, var(--ac), var(--ac2));"><i class="fas fa-code"></i></div>
            <div class="proj-name">${p.name}</div>
            <div class="proj-meta">${Object.keys(p.files).length} files</div>
            <div class="proj-del" data-del="${p.id}"><i class="fas fa-trash"></i></div>
        </div>
    `).join('');
    g.querySelectorAll('.proj-card').forEach(c => c.onclick = e => { if(e.target.closest('.proj-del')) return; openEditor(c.dataset.id); });
    g.querySelectorAll('[data-del]').forEach(b => b.onclick = e => { e.stopPropagation(); S.projects = S.projects.filter(p => p.id !== b.dataset.del); saveProjects(); renderGrid(); });
}

function renderTemplates() {
    const g = document.getElementById('tmpl-grid');
    g.innerHTML = TEMPLATES.map(t => `
        <div class="proj-card" onclick="useTemplate('${t.id}')">
            <div class="proj-card-thumb" style="background:linear-gradient(135deg, ${t.color}, #1e1b4b);"><i class="fas fa-rocket"></i></div>
            <div class="proj-name">${t.title} <i class="fas fa-check-circle verified-badge" title="Verified by CodeMaker AI"></i></div>
            <div class="proj-meta">by ${t.author}</div>
        </div>
    `).join('');
}

function useTemplate(id) {
    const t = TEMPLATES.find(x => x.id === id);
    if (!t) return;
    openEditor(createProj(t.prompt, S.model).id);
}

function switchLibView(view) {
    if (view === 'projects') {
        document.getElementById('projects-view').style.display = 'block';
        document.getElementById('templates-view').style.display = 'none';
        document.getElementById('tab-projects').classList.add('active');
        document.getElementById('tab-templates').classList.remove('active');
    } else {
        document.getElementById('projects-view').style.display = 'none';
        document.getElementById('templates-view').style.display = 'block';
        document.getElementById('tab-projects').classList.remove('active');
        document.getElementById('tab-templates').classList.add('active');
    }
}

function getFileIcon(f) {
    if (f.endsWith('.html')) return 'fa-html5';
    if (f.endsWith('.css')) return 'fa-css3-alt';
    if (f.endsWith('.js')) return 'fa-js';
    if (f.endsWith('.md')) return 'fa-markdown';
    return 'fa-file-code';
}

function fmtAI(content) {
    if (!content) return '';
    let html = '';
    const lines = content.split('\n');
    let inTaskList = false;
    let tasksFound = false;

    lines.forEach(line => {
        if (line.startsWith('- [ ] ')) {
            tasksFound = true;
            S.tasks.push(line.substring(6).trim());
            if (!inTaskList) { inTaskList = true; }
        } else if (line.trim() === '') {
            if (inTaskList) { inTaskList = false; }
        } else {
            if (inTaskList) { inTaskList = false; }
            let h = line.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html += `<p>${h}</p>`;
        }
    });
    
    if (tasksFound) {
        renderTasks();
    }
    return html;
}

function renderTasks() {
    const view = document.getElementById('tasks-view');
    if (S.tasks.length === 0) {
        view.innerHTML = '<div style="color:var(--mt);text-align:center;padding:40px;">No tasks yet. The AI will plan its work here.</div>';
        return;
    }
    view.innerHTML = `<div class="task-card">${S.tasks.map(t => `<div class="task-item"><i class="far fa-circle"></i> ${t}</div>`).join('')}</div>`;
}

function openEditor(id) {
    const p = S.projects.find(x => x.id === id); if (!p) return;
    S.cur = id; S.model = p.model; S.activeFile = p.activeFile || 'index.html'; S.tasks = [];
    document.getElementById('home-view').style.display = 'none';
    document.getElementById('editor-view').classList.add('active');
    document.getElementById('ed-title').textContent = p.name;
    document.getElementById('ms-lbl').textContent = p.model;
    renderChat(); renderFiles(); renderTasks(); renderAssets();
    
    if (cm) {
        cm.setValue('');
        cm.setOption('mode', 'htmlmixed');
        cm.refresh();
    }
    
    loadFileToEditor();
    updatePreview();
    switchView('prev');
    
    if (p.messages.length === 1 && p.messages[0].role === 'user' && (!p.files['index.html'] || p.files['index.html'] === '')) {
        generate();
    }
}

function closeEditor() { S.gen = false; document.getElementById('editor-view').classList.remove('active'); document.getElementById('home-view').style.display = 'block'; S.cur = null; renderGrid(); }

function switchView(v) {
    S.view = v;
    document.querySelectorAll('.ptab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
    document.getElementById('prev-frame').style.display = v === 'prev' ? 'block' : 'none';
    document.getElementById('code-view').style.display = v === 'code' ? 'flex' : 'none';
    document.getElementById('tasks-view').style.display = v === 'tasks' ? 'flex' : 'none';
    document.getElementById('assets-view').style.display = v === 'assets' ? 'flex' : 'none';
    if (v === 'code') {
        loadFileToEditor();
        setTimeout(() => { if (cm) cm.refresh(); }, 10);
    }
}

function renderChat() {
    const p = S.projects.find(x => x.id === S.cur); if (!p) return;
    const c = document.getElementById('chat-msgs'); c.innerHTML = '';
    if (p.messages.length === 0) {
        c.innerHTML = `<div class="chat-welcome"><i class="fas fa-comments"></i><h3>Start Building</h3><p>Describe what you want to build.</p></div>`;
        return;
    }
    
    p.messages.forEach((m, i) => {
        if (m.role === 'user') {
            if (typeof m.content === 'string') addMsg('user', m.content, false, i);
        } else if (m.role === 'assistant') {
            if (m.content) {
                const msgDiv = addMsg('ai', fmtAI(m.content), false, i);
                if (i === p.messages.length - 1 && !S.gen) {
                    const actions = document.createElement('div');
                    actions.className = 'msg-actions';
                    actions.innerHTML = `
                        <button class="msg-action-btn" onclick="copyMsg(${i})"><i class="fas fa-copy"></i> Copy</button>
                        <button class="msg-action-btn" onclick="retryGen()"><i class="fas fa-redo"></i> Retry</button>
                    `;
                    msgDiv.querySelector('.msg-bubble').appendChild(actions);
                }
            }
            if (m.tool_calls) {
                m.tool_calls.forEach(tc => {
                    const t = document.createElement('div');
                    t.className = 'msg tool';
                    t.style.animation = 'none';
                    let badge = '';
                    if (tc.function.name === 'write_file') {
                        const args = JSON.parse(tc.function.arguments);
                        badge = `<div class="tool-badge write"><i class="fas fa-check-circle"></i> Wrote ${args.filename}</div>`;
                    } else if (tc.function.name === 'generate_asset') {
                        const args = JSON.parse(tc.function.arguments);
                        badge = `<div class="tool-badge asset"><i class="fas fa-image"></i> Generated ${args.type}: ${args.prompt}</div>`;
                    }
                    t.innerHTML = `<div class="msg-av"><i class="fas fa-tools"></i></div><div class="msg-bubble" style="background:transparent; border:none; padding:0;">${badge}</div>`;
                    c.appendChild(t);
                });
            }
        }
    });
    c.scrollTop = c.scrollHeight;
}

function addMsg(role, content, animate=true, msgIndex=-1) {
    const c = document.getElementById('chat-msgs');
    const w = c.querySelector('.chat-welcome'); if (w) w.remove();
    const row = document.createElement('div');
    row.className = `msg ${role}`;
    if (!animate) row.style.animation = 'none';
    row.innerHTML = `<div class="msg-av"><i class="fas ${role === 'ai' ? 'fa-robot' : 'fa-user'}"></i></div><div class="msg-bubble">${content}<div class="msg-progress-bar"></div></div>`;
    if(msgIndex >= 0) row.dataset.msgIndex = msgIndex;
    c.appendChild(row); c.scrollTop = c.scrollHeight; return row;
}

window.copyMsg = function(index) {
    const p = S.projects.find(x => x.id === S.cur);
    const msg = p.messages[index];
    if (msg && msg.content) {
        navigator.clipboard.writeText(msg.content);
        toast('Message copied!');
    }
};

window.retryGen = function() {
    const p = S.projects.find(x => x.id === S.cur);
    if (!p || S.gen) return;
    // Remove last assistant message
    if (p.messages.length > 0 && p.messages[p.messages.length-1].role === 'assistant') {
        p.messages.pop();
    }
    S.tasks = []; // Clear tasks
    saveProjects();
    renderChat();
    renderTasks();
    generate();
};

function renderFiles() {
    const p = S.projects.find(x => x.id === S.cur); if (!p) return;
    const bar = document.getElementById('files-bar'); bar.innerHTML = '';
    Object.keys(p.files).forEach(f => {
        const t = document.createElement('div');
        const isLocked = p.lockedFiles.includes(f);
        t.className = `file-tab ${f === S.activeFile ? 'active' : ''}`;
        t.innerHTML = `<i class="fab ${getFileIcon(f)}"></i> ${f} <span class="file-lock ${isLocked ? 'locked' : ''}" onclick="event.stopPropagation(); toggleLock('${f}')"><i class="fas ${isLocked ? 'fa-lock' : 'fa-lock-open'}"></i></span>`;
        t.onclick = () => selectFile(f);
        bar.appendChild(t);
    });
}

function toggleLock(f) {
    const p = S.projects.find(x => x.id === S.cur);
    const idx = p.lockedFiles.indexOf(f);
    if (idx > -1) p.lockedFiles.splice(idx, 1);
    else p.lockedFiles.push(f);
    saveProjects(); renderFiles();
}

function selectFile(f) {
    if (cm && S.activeFile) { const p = S.projects.find(x => x.id === S.cur); if (p) p.files[S.activeFile] = cm.getValue(); saveProjects(); }
    S.activeFile = f;
    const p = S.projects.find(x => x.id === S.cur); if (p) p.activeFile = f; saveProjects();
    renderFiles();
    if (S.view === 'code') {
        loadFileToEditor();
        setTimeout(() => { if (cm) cm.refresh(); }, 10);
    }
}

function loadFileToEditor() {
    const p = S.projects.find(x => x.id === S.cur); if (!p || !cm) return;
    cm.setValue(p.files[S.activeFile] || '');
    let mode = 'htmlmixed';
    if (S.activeFile.endsWith('.css')) mode = 'css';
    else if (S.activeFile.endsWith('.js') || S.activeFile.endsWith('.jsx') || S.activeFile.endsWith('.ts') || S.activeFile.endsWith('.tsx')) mode = 'javascript';
    else if (S.activeFile.endsWith('.json')) mode = 'application/json';
    else if (S.activeFile.endsWith('.md')) mode = 'markdown';
    else if (S.activeFile.endsWith('.py')) mode = 'python';
    cm.setOption('mode', mode);
}

function updatePreview() {
    if (!S.autoRefresh) return;
    const p = S.projects.find(x => x.id === S.cur); if (!p) return;
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>${p.files['style.css']||''}</style></head><body>${p.files['index.html']||''}<script>${p.files['script.js']||''}<\/script></body></html>`;
    document.getElementById('prev-frame').srcdoc = html;
}

function showHistory() {
    const p = S.projects.find(x => x.id === S.cur); if (!p) return;
    const modalBody = document.getElementById('generic-modal-body');
    document.getElementById('generic-modal-title').innerText = 'Version History';
    
    let html = '<div style="color:var(--mt);text-align:center;padding:20px;">No history yet. History is saved when the AI makes changes.</div>';
    if (p.history.length > 0) {
        html = '';
        p.history.forEach((snap, i) => {
            html += `<div class="history-item"><span>Version ${i + 1} - ${new Date(snap.ts).toLocaleTimeString()}</span><button class="restore-btn" onclick="restoreVersion(${i})">Restore</button></div>`;
        });
    }
    modalBody.innerHTML = html;
    document.getElementById('generic-modal').classList.add('show');
}

function restoreVersion(i) {
    const p = S.projects.find(x => x.id === S.cur); if (!p) return;
    const snap = p.history[i];
    p.files = JSON.parse(JSON.stringify(snap.files));
    saveProjects(); renderFiles(); loadFileToEditor(); updatePreview();
    document.getElementById('generic-modal').classList.remove('show');
    toast('Version restored!');
}

function renderAssets() {
    const p = S.projects.find(x => x.id === S.cur); if (!p) return;
    const view = document.getElementById('assets-view');
    view.innerHTML = '';
    if (!p.assets || p.assets.length === 0) {
        view.innerHTML = '<div style="color:var(--mt);text-align:center;padding:40px;">No assets generated yet.</div>';
        return;
    }
    p.assets.forEach(asset => {
        const card = document.createElement('div');
        card.className = 'asset-card';
        card.innerHTML = `
            <div class="asset-preview">${asset.type === 'image' ? `<img src="${asset.url}" alt="${asset.prompt}">` : `<video src="${asset.url}" muted loop autoplay></video>`}</div>
            <div class="asset-info">
                <div class="asset-type">${asset.type.toUpperCase()}</div>
                <div class="asset-prompt">${asset.prompt}</div>
            </div>
        `;
        view.appendChild(card);
    });
}

async function exportToGithub() {
    const p = S.projects.find(x => x.id === S.cur);
    if (!p) return;
    const modalBody = document.getElementById('generic-modal-body');
    document.getElementById('generic-modal-title').innerText = 'Export to GitHub';
    
    if (S.githubToken) {
        modalBody.innerHTML = `
            <p class="modal-desc">Push "${p.name}" to a new GitHub repository. The AI will auto-generate a README.md and commit message.</p>
            <button class="modal-btn gh" id="gh-push-btn"><i class="fab fa-github"></i> Create Repo & Push Code</button>
            <button style="width:100%;margin-top:8px;background:transparent;color:var(--mt);border:1px solid var(--border);padding:10px;border-radius:8px;cursor:pointer;" onclick="logoutGithub()">Logout / Change Token</button>
        `;
        document.getElementById('gh-push-btn').onclick = startGithubPush;
    } else {
        modalBody.innerHTML = `
            <p class="modal-desc">To push code directly to GitHub, you need a Personal Access Token (PAT) with 'repo' permissions. <br><br><a href="https://github.com/settings/tokens/new?scopes=repo,workflow&description=CodeMakerAI" target="_blank" style="color:var(--ac);">Click here to generate one on GitHub</a>.</p>
            <input type="password" class="modal-input" id="gh-token-input" placeholder="Paste your GitHub token here (ghp_...)">
            <button class="modal-btn gh" id="gh-save-btn"><i class="fab fa-github"></i> Save Token & Continue</button>
        `;

function logoutGithub() {
    localStorage.removeItem('gh_token');
    S.githubToken = '';
    exportToGithub();
}

async function startGithubPush() {
    const p = S.projects.find(x => x.id === S.cur);
    const token = S.githubToken;
    const modalBody = document.getElementById('generic-modal-body');
    
    modalBody.innerHTML = `<div style="text-align:center; padding: 20px;"><div class="spinner" style="width:24px;height:24px;margin:0 auto 12px;"></div> AI is writing README.md...</div>`;

    let readmeContent = `# ${p.name}\n\nGenerated by CodeMaker AI.`;
    try {
        const filesConcat = Object.keys(p.files).map(f => 'File: ' + f + '\n\`\`\`\n' + p.files[f] + '\n\`\`\`\n').join('\n').substring(0, 3000);
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
            body: JSON.stringify({
                model: MODELS[S.model],
                messages: [
                    { role: 'system', content: 'Write a professional GitHub README.md in pure markdown. Include title, description, features, and how to run.' },
                    { role: 'user', content: 'Project Name: ' + p.name + '\nInitial Prompt: ' + p.messages[0].content + '\nCode Files:\n' + filesConcat }
                ],
                stream: false
            })
        });
        if (res.ok) {
            const j = await res.json();
            readmeContent = j.choices[0].message.content;
            if (!readmeContent.startsWith('#')) readmeContent = `# ${p.name}\n\n` + readmeContent;
        }
    } catch(e) { /* fallback to basic readme */ }

    modalBody.innerHTML = `<div style="text-align:center; padding: 20px;"><div class="spinner" style="width:24px;height:24px;margin:0 auto 12px;"></div> Creating GitHub Repository...</div>`;

    const repoName = p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + uid().substring(0,4);
    let owner;
    try {
        const res = await fetch('https://api.github.com/user/repos', {
            method: 'POST',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' },
            body: JSON.stringify({ name: repoName, description: 'Generated by CodeMaker AI', private: false })
        });
        if (!res.ok) throw new Error('Failed to create repo');
        const data = await res.json();
        owner = data.owner.login;
    } catch(e) {
        modalBody.innerHTML = `<p style="color:var(--dn);text-align:center;">Error creating repo. Check your token permissions.</p>`;
        return;
    }

    modalBody.innerHTML = `<div style="text-align:center; padding: 20px;"><div class="spinner" style="width:24px;height:24px;margin:0 auto 12px;"></div> Pushing files...</div>`;

    try {
        const treeItems = [];
        for (const filename in p.files) {
            const content = p.files[filename];
            const blobRes = await fetch(`https://api.github.com/repos/${owner}/${repoName}/git/blobs`, {
                method: 'POST',
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' },
                body: JSON.stringify({ content: content, encoding: 'utf-8' })
            });
            if (!blobRes.ok) throw new Error('Failed to create blob for ' + filename);
            const blobData = await blobRes.json();
            treeItems.push({ path: filename, mode: '100644', type: 'blob', sha: blobData.sha });
        }
        
        const readmeBlobRes = await fetch(`https://api.github.com/repos/${owner}/${repoName}/git/blobs`, {
            method: 'POST',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' },
            body: JSON.stringify({ content: readmeContent, encoding: 'utf-8' })
        });
        const readmeBlobData = await readmeBlobRes.json();
        treeItems.push({ path: 'README.md', mode: '100644', type: 'blob', sha: readmeBlobData.sha });

        const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repoName}/git/trees`, {
            method: 'POST',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' },
            body: JSON.stringify({ tree: treeItems })
        });
        if (!treeRes.ok) throw new Error('Failed to create tree');
        const treeData = await treeRes.json();

        const commitRes = await fetch(`https://api.github.com/repos/${owner}/${repoName}/git/commits`, {
            method: 'POST',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' },
            body: JSON.stringify({ message: `feat: initial commit for ${p.name} generated by CodeMaker AI`, tree: treeData.sha, parents: [] })
        });
        if (!commitRes.ok) throw new Error('Failed to create commit');
        const commitData = await commitRes.json();

        await fetch(`https://api.github.com/repos/${owner}/${repoName}/git/refs/heads/main`, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' },
            body: JSON.stringify({ sha: commitData.sha })
        });

        modalBody.innerHTML = `
            <div style="text-align:center; padding: 20px;">
                <i class="fas fa-check-circle" style="font-size:32px;color:var(--ok);margin-bottom:12px;"></i>
                <h3 style="margin-bottom:8px;">Successfully Pushed!</h3>
                <p style="color:var(--mt);margin-bottom:20px;">Your project is now live on GitHub.</p>
                <a href="https://github.com/${owner}/${repoName}" target="_blank" class="modal-btn gh" style="text-decoration:none;display:block;"><i class="fab fa-github"></i> Open Repository</a>
            </div>
        `;
    } catch(e) {
        modalBody.innerHTML = `<p style="color:var(--dn);text-align:center;">Error pushing files: ${e.message}</p>`;
    }
}

async function enhancePrompt() {
    const inp = document.getElementById('chat-input');
    const v = inp.value.trim();
    if (!v) return toast('Type a prompt first.');
    document.getElementById('chat-send').disabled = true;
    inp.value = 'Enhancing prompt...';
    const body = { model: MODELS[S.model], messages: [{ role: 'system', content: 'Expand the user\'s prompt into a detailed UI/UX spec. Output ONLY the prompt.' }, { role: 'user', content: v }], temperature: 0.7, stream: false };
    try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` }, body: JSON.stringify(body) });
        if (!res.ok) throw new Error('Failed');
        const j = await res.json();
        inp.value = j.choices[0].message.content;
    } catch (e) {
        inp.value = v; toast('Enhance failed.');
    }
    document.getElementById('chat-send').disabled = false;
}

async function callAI(messages, modelKey, tools) {
    const body = { model: MODELS[modelKey], messages: [{role:'system', content: getSystemPrompt()}, ...messages], temperature: 0.7, stream: false, tools: tools };
    const headers = { 'Content-Type':'application/json', 'Authorization':`Bearer ${API_KEY}` };
    try {
        const ctrl = new AbortController();
        abortCtrl = ctrl;
        const timer = setTimeout(() => ctrl.abort(), 90000);
        const res = await fetch(API_URL, { signal: ctrl.signal, method:'POST', headers, body: JSON.stringify(body) });
        clearTimeout(timer);
        if (res.ok) {
            const j = await res.json();
            const choice = j.choices[0];
            return { content: choice.message.content || '', toolCalls: choice.message.tool_calls || [], finishReason: choice.finish_reason };
        }
        throw new Error(`Direct HTTP ${res.status}`);
    } catch(e) {
        if (e.name === 'AbortError') throw new Error('Request aborted');
        const res = await fetch(PROXY + encodeURIComponent(API_URL), { method:'POST', headers, body: JSON.stringify(body) });
        if (res.ok) {
            const j = await res.json();
            const choice = j.choices[0];
            return { content: choice.message.content || '', toolCalls: choice.message.tool_calls || [], finishReason: choice.finish_reason };
        }
        throw new Error(`Proxy HTTP ${res.status}`);
    }
}

async function generateAsset(type, prompt) {
    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` };
    if (type === 'image') {
        const body = JSON.stringify({ model: 'agnes-image-2.0-flash', prompt: prompt, n: 1, size: '1024x1024' });
        let res;
        try { res = await fetch(IMG_API_URL, { method: 'POST', headers, body }); if (!res.ok) throw new Error(); } catch (e) { res = await fetch(PROXY + encodeURIComponent(IMG_API_URL), { method: 'POST', headers, body }); }
        if (!res || !res.ok) throw new Error('Image API failed');
        const data = await res.json();
        if (data.data && data.data[0]) return data.data[0].url || `data:image/png;base64,${data.data[0].b64_json}`;
        throw new Error('Image API failed');
    } else {
        const body = JSON.stringify({ model: 'agnes-video-v2.0', prompt: prompt });
        let res;
        try { res = await fetch(VID_API_URL, { method: 'POST', headers, body }); if (!res.ok) throw new Error(); } catch (e) { res = await fetch(PROXY + encodeURIComponent(VID_API_URL), { method: 'POST', headers, body }); }
        if (!res || !res.ok) throw new Error('Video API failed');
        const data = await res.json();
        if (data.data && data.data[0] && data.data[0].url) return data.data[0].url;
        throw new Error('Video API failed');
    }
}

function showContinueButton() { document.getElementById('continue-wrap').style.display = 'block'; }
function hideContinueButton() { document.getElementById('continue-wrap').style.display = 'none'; }

function continueGen() {
    hideContinueButton();
    const p = S.projects.find(x => x.id === S.cur);
    p.messages.push({ role: 'user', content: 'Please continue.' });
    saveProjects(); addMsg('user', 'Please continue.');
    generate();
}

async function generate() {
    const p = S.projects.find(x => x.id === S.cur);
    if (!p || S.gen) return;
    S.gen = true;
    updateSendButton();
    hideContinueButton();
    
    // Add Thinking Message with Skeleton
    const md = addMsg('ai', '', true);
    md.classList.add('thinking');
    const statusLog = md.querySelector('.msg-bubble');
    statusLog.innerHTML = '<div class="skeleton-line"></div><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:60%"></div><div class="msg-progress-bar"></div>';
    
    let currentMessages = [...p.messages];
    p.history.push({ ts: Date.now(), files: JSON.parse(JSON.stringify(p.files)) });
    if (p.history.length > 10) p.history.shift();
    saveProjects();
    
    const tools = [{ type: "function", function: { name: "write_file", description: "Write file content.", parameters: { type: "object", properties: { filename: { type: "string" }, content: { type: "string" } }, required: ["filename", "content"] } } }];
    const lastUserMsg = currentMessages.filter(m => m.role === 'user').pop();
    const promptText = typeof lastUserMsg.content === 'string' ? lastUserMsg.content : '';
    if (/image|img|video|picture|photo|asset|background/i.test(promptText)) {
        tools.push({ type: "function", function: { name: "generate_asset", description: "Gen image/video.", parameters: { type: "object", properties: { type: { type: "string", enum: ["image", "video"] }, prompt: { type: "string" } }, required: ["type", "prompt"] } } });
    }
    
    try {
        while (true) {
            const res = await callAI(currentMessages, p.model, tools);
            const choice = { role: 'assistant', content: res.content, tool_calls: res.toolCalls.length ? res.toolCalls : undefined };
            currentMessages.push(choice);
            p.messages = currentMessages;
            saveProjects();
            
            if (choice.tool_calls && choice.tool_calls.length) {
                statusLog.innerHTML = choice.content ? fmtAI(choice.content) : '';
                md.classList.remove('thinking');
                for (const tc of choice.tool_calls) {
                    const toolMsg = { role: "tool", tool_call_id: tc.id, name: tc.function.name };
                    if (tc.function.name === 'write_file') {
                        const args = JSON.parse(tc.function.arguments);
                        statusLog.innerHTML += `<div class="tool-badge write"><div class="spinner"></div> Writing ${args.filename}...</div>`;
                        if (!p.lockedFiles.includes(args.filename)) p.files[args.filename] = args.content;
                        saveProjects(); updatePreview(); renderFiles();
                        if (S.view === 'code') loadFileToEditor();
                        toolMsg.content = "File written.";
                        statusLog.innerHTML += `<div class="tool-badge write"><i class="fas fa-check-circle"></i> Wrote ${args.filename}</div>`;
                    } else if (tc.function.name === 'generate_asset') {
                        const args = JSON.parse(tc.function.arguments);
                        statusLog.innerHTML += `<div class="tool-badge asset"><div class="spinner"></div> Generating ${args.type}...</div>`;
                        try {
                            const url = await generateAsset(args.type, args.prompt);
                            p.assets.push({ id: uid(), type: args.type, url, prompt: args.prompt });
                            saveProjects(); renderAssets();
                            toolMsg.content = `Asset URL: ${url}`;
                            statusLog.innerHTML += `<div class="tool-badge asset"><i class="fas fa-check-circle"></i> Asset ready</div>`;
                        } catch(e) {
                            toolMsg.content = "Failed.";
                            statusLog.innerHTML += `<div class="tool-badge asset" style="color:var(--dn)">Failed</div>`;
                        }
                    }
                    currentMessages.push(toolMsg);
                    p.messages = currentMessages;
                    saveProjects();
                }
            } else {
                md.classList.remove('thinking');
                if (res.finishReason === 'length') {
                    statusLog.innerHTML += '<br><span style="color:var(--warn)">⚠️ Cut off.</span>';
                    showContinueButton();
                    break;
                }
                statusLog.innerHTML = choice.content ? fmtAI(choice.content) : "Done.";
                // Add action buttons
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                actions.innerHTML = `
                    <button class="msg-action-btn" onclick="copyMsg(${p.messages.length-1})"><i class="fas fa-copy"></i> Copy</button>
                    <button class="msg-action-btn" onclick="retryGen()"><i class="fas fa-redo"></i> Retry</button>
                `;
                statusLog.appendChild(actions);
                break;
            }
        }
    } catch(e) {
        md.classList.remove('thinking');
        if (e.message.includes('aborted')) {
            statusLog.innerHTML = '<span style="color:var(--mt)">Generation stopped.</span>';
        } else {
            statusLog.innerHTML += `<br><span style="color:var(--dn)">Error: ${e.message}</span>`;
            showContinueButton();
        }
    }
    S.gen = false;
    updateSendButton();
    saveProjects();
}

function updateSendButton() {
    const btn = document.getElementById('chat-send');
    if (S.gen) {
        btn.classList.add('stop');
        btn.innerHTML = '<i class="fas fa-stop"></i>';
        btn.disabled = false;
        btn.onclick = () => { if(abortCtrl) abortCtrl.abort(); };
    } else {
        btn.classList.remove('stop');
        btn.innerHTML = '<i class="fas fa-arrow-up"></i>';
        btn.disabled = !document.getElementById('chat-input').value.trim();
        btn.onclick = () => {
            const inp = document.getElementById('chat-input'); const v = inp.value.trim(); if (!v || S.gen) return;
            const p = S.projects.find(x => x.id === S.cur); p.messages.push({role:'user', content:v}); saveProjects(); addMsg('user', v);
            inp.value = ''; document.getElementById('chat-send').disabled = true; generate();
        };
    }
}

let ti = 0, ci = 0, idl = false, ttr = null;
function runTyping() {
    const inp = document.getElementById('hero-input'); if (!inp) return;
    if (document.activeElement === inp || inp.value.length > 0) { clearTimeout(ttr); ttr = setTimeout(runTyping, 500); return; }
    const ideas = ["Build a snake game", "Create a portfolio site", "Make a pricing table", "Build a calculator"];
    const idea = ideas[ti % ideas.length];
    if (!idl) { ci++; document.getElementById('typed-text').textContent = idea.substring(0, ci); if (ci === idea.length) { idl = true; ttr = setTimeout(runTyping, 2000); return; } ttr = setTimeout(runTyping, 45); }
    else { ci--; document.getElementById('typed-text').textContent = idea.substring(0, ci); if (ci === 0) { idl = false; ti++; ttr = setTimeout(runTyping, 300); return; } ttr = setTimeout(runTyping, 25); }
}

function applyZoom() {
    document.getElementById('prev-frame').style.transform = `scale(${S.zoom})`;
    document.getElementById('prev-frame').style.transformOrigin = 'top left';
    document.getElementById('zoom-text').innerText = Math.round(S.zoom * 100) + '%';
}

function init() {
    try {
        loadProjects(); renderGrid(); renderTemplates(); runTyping();
        if (typeof CodeMirror !== 'undefined') {
            cm = CodeMirror.fromTextArea(document.getElementById('code-editor'), { lineNumbers: true, theme: 'default', indentUnit: 2 });
        }
        document.getElementById('hero-submit').onclick = () => { const v = document.getElementById('hero-input').value.trim(); if (!v) return; openEditor(createProj(v).id); };
        document.querySelectorAll('#home-models .mp').forEach(b => b.onclick = () => { document.querySelectorAll('#home-models .mp').forEach(x => x.classList.remove('active')); b.classList.add('active'); S.model = b.dataset.model; });
        document.getElementById('new-btn').onclick = () => { document.getElementById('home-view').scrollTo({top:0, behavior:'smooth'}); document.getElementById('hero-input').focus(); };
        
        document.getElementById('back-btn').onclick = closeEditor;
        document.getElementById('ms-btn').onclick = e => { e.stopPropagation(); document.getElementById('ms-menu').classList.toggle('open'); };
        document.addEventListener('click', () => document.getElementById('ms-menu').classList.remove('open'));
        document.querySelectorAll('.ms-item').forEach(o => o.onclick = e => { e.stopPropagation(); S.model = o.dataset.model; const p = S.projects.find(x => x.id === S.cur); if (p) { p.model = S.model; saveProjects(); } document.getElementById('ms-lbl').textContent = S.model; document.getElementById('ms-menu').classList.remove('open'); });
        
        document.getElementById('btn-github').onclick = exportToGithub;
        document.getElementById('btn-history').onclick = showHistory;
        document.querySelectorAll('.ptab').forEach(t => t.onclick = () => switchView(t.dataset.view));
        document.querySelectorAll('.mtab').forEach(t => t.onclick = () => {
            document.querySelectorAll('.mtab').forEach(x => x.classList.remove('active')); t.classList.add('active');
            const body = document.getElementById('ed-body');
            body.classList.toggle('mobile-chat', t.dataset.tab === 'chat');
            body.classList.toggle('mobile-prev', t.dataset.tab === 'prev');
        });
        
        document.getElementById('btn-enhance').onclick = enhancePrompt;
        document.getElementById('chat-input').oninput = function() { if(!S.gen) document.getElementById('chat-send').disabled = !this.value.trim(); this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; };
        document.getElementById('chat-input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); updateSendButton(); if(!S.gen) document.getElementById('chat-send').click(); } };
        
        document.getElementById('apply-btn').onclick = () => { const p = S.projects.find(x => x.id === S.cur); if (p) { p.files[S.activeFile] = cm ? cm.getValue() : ''; saveProjects(); updatePreview(); toast('Applied!'); } };
        
        // Preview Controls
        document.getElementById('zoom-in').onclick = () => { S.zoom = Math.min(2, S.zoom + 0.1); applyZoom(); };
        document.getElementById('zoom-out').onclick = () => { S.zoom = Math.max(0.5, S.zoom - 0.1); applyZoom(); };
        document.getElementById('auto-refresh').onclick = (e) => {
            S.autoRefresh = !S.autoRefresh;
            e.currentTarget.classList.toggle('active', S.autoRefresh);
            if (S.autoRefresh) updatePreview();
        };
        document.getElementById('refresh-btn').onclick = () => { const p = S.projects.find(x => x.id === S.cur); if (p) { document.getElementById('prev-frame').srcdoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${p.files['style.css']||''}</style></head><body>${p.files['index.html']||''}<script>${p.files['script.js']||''}<\/script></body></html>`; } };

        document.getElementById('btn-share').onclick = () => { const p = S.projects.find(x => x.id === S.cur); navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}#share=${btoa(JSON.stringify(p.files))}`); toast('Link copied!'); };
        document.getElementById('btn-zip').onclick = async () => { if (typeof JSZip === 'undefined') return; const p = S.projects.find(x => x.id === S.cur); const zip = new JSZip(); Object.keys(p.files).forEach(f => zip.file(f, p.files[f])); const blob = await zip.generateAsync({type:'blob'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${p.name}.zip`; a.click(); };
        document.getElementById('btn-theme').onclick = () => { document.body.classList.toggle('dark'); if (cm) cm.setOption('theme', document.body.classList.contains('dark') ? 'material-darker' : 'default'); };
        
        updateSendButton(); // Initialize button state
    } catch(e) { console.error(e); toast("Init error."); }
}
document.addEventListener('DOMContentLoaded', init);
